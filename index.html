<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター評価（カスタマイズ可能）</title>
    <style>
        body {
            font-family: -apple-system, Blink-Mac-System, "Helvetica Neue", "Segoe UI", YuGothic, "Yu Gothic", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .character-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative; /* 削除ボタンの配置用 */
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }
        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            border: 3px solid #f9d71c;
            position: relative;
            background-color: #e0e0e0;
        }
        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .character-image::after {
            content: attr(data-rank);
            position: absolute;
            bottom: -5px;
            right: -5px;
            background-color: #a42c2c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 12px;
            border: 2px solid white;
            line-height: 1;
        }
        .character-name {
            font-size: 28px;
            font-weight: bold;
            color: #4a4a4a;
        }
        .character-rank {
            background-color: #a42c2c;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-left: 10px;
        }
        .ranking-text {
            font-size: 18px;
            color: #777;
            margin-left: 10px;
        }
        .stats-table {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            text-align: center;
        }
        .stats-item {
            flex: 1;
            padding: 8px;
        }
        .stats-item:first-child {
            background-color: #c9c9c9;
            font-weight: bold;
        }
        .stats-item .label {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .stats-item .value {
            font-size: 20px;
            font-weight: bold;
        }
        .skill-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skill-list li {
            position: relative;
            padding-left: 1.5em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .skill-list li::before {
            content: '・';
            position: absolute;
            left: 0;
            color: #4a4a4a;
        }
        .image-input {
            margin-top: 10px;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            cursor: pointer;
            text-align: center;
        }
        .image-input:hover {
            background-color: #e9e9e9;
        }
        .add-card-btn {
            display: block;
            width: 100%;
            padding: 15px;
            text-align: center;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .add-card-btn:hover {
            background-color: #45a049;
        }
        .delete-card-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="cards-container">
        <div class="character-card">
            <button class="delete-card-btn" onclick="deleteCard(this)">×</button>
            <div class="card-header">
                <div class="character-image" data-rank="?">
                    <img src="" alt="" class="card-image">
                </div>
                <div>
                    <div class="character-name" contenteditable="true">キャラクター名</div>
                    <div style="display: flex; align-items: baseline;">
                        <span class="character-rank" contenteditable="true">?位</span>
                        <span class="ranking-text" contenteditable="true">/??位</span>
                        <span class="character-rank" style="background-color: #3b5998;" contenteditable="true">?</span>
                    </div>
                </div>
            </div>
            <label class="image-input">画像を選択<input type="file" style="display: none;" accept="image/*"></label>
            <div class="stats-table" contenteditable="true">
                <div class="stats-item">
                    <div class="label">耐久</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">攻撃</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">安定性</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">機動力</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">援護</div>
                    <div class="value">?</div>
                </div>
            </div>
            <ul class="skill-list" contenteditable="true">
                <li>ここにスキルや評価を入力してください</li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>
    
    <button class="add-card-btn" onclick="addCard()">＋ カードを追加</button>

    <script>
        const cardsContainer = document.getElementById('cards-container');
        const dbName = 'characterDB';
        const dbVersion = 1;
        let db;

        // IndexedDBのセットアップ
        const request = indexedDB.open(dbName, dbVersion);

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            db.createObjectStore('cards', { keyPath: 'id' });
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            loadCards();
        };

        request.onerror = (event) => {
            console.error('IndexedDB error:', event.target.errorCode);
        };

        // カードのHTMLテンプレート
        const cardTemplate = `
            <button class="delete-card-btn" onclick="deleteCard(this)">×</button>
            <div class="card-header">
                <div class="character-image" data-rank="?">
                    <img src="" alt="" class="card-image">
                </div>
                <div>
                    <div class="character-name" contenteditable="true">キャラクター名</div>
                    <div style="display: flex; align-items: baseline;">
                        <span class="character-rank" contenteditable="true">?位</span>
                        <span class="ranking-text" contenteditable="true">/??位</span>
                        <span class="character-rank" style="background-color: #3b5998;" contenteditable="true">?</span>
                    </div>
                </div>
            </div>
            <label class="image-input">画像を選択<input type="file" style="display: none;" accept="image/*"></label>
            <div class="stats-table" contenteditable="true">
                <div class="stats-item">
                    <div class="label">耐久</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">攻撃</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">安定性</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">機動力</div>
                    <div class="value">?</div>
                </div>
                <div class="stats-item">
                    <div class="label">援護</div>
                    <div class="value">?</div>
                </div>
            </div>
            <ul class="skill-list" contenteditable="true">
                <li>ここにスキルや評価を入力してください</li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        `;

        // 新しいカードを追加
        function addCard(data = null) {
            const newCard = document.createElement('div');
            newCard.className = 'character-card';
            newCard.innerHTML = cardTemplate;
            newCard.dataset.id = data ? data.id : Date.now().toString();

            const imageInput = newCard.querySelector('input[type="file"]');
            const cardImage = newCard.querySelector('.card-image');
            
            imageInput.addEventListener('change', handleImageChange);
            newCard.querySelectorAll('[contenteditable="true"]').forEach(elem => {
                elem.addEventListener('input', () => saveCard(newCard));
            });

            if (data) {
                newCard.querySelector('.character-name').innerHTML = data.name || '';
                newCard.querySelector('.character-rank').innerHTML = data.rank || '';
                newCard.querySelector('.ranking-text').innerHTML = data.rankTotal || '';
                newCard.querySelector('.character-rank[style*="background-color: #3b5998;"]').innerHTML = data.tier || '';
                newCard.querySelector('.stats-table').innerHTML = data.stats || '';
                newCard.querySelector('.skill-list').innerHTML = data.skills || '';
                if (data.image) {
                    cardImage.src = data.image;
                }
            }
            
            cardsContainer.appendChild(newCard);
            saveCards();
        }
        
        // カードを保存
        function saveCards() {
            const transaction = db.transaction('cards', 'readwrite');
            const objectStore = transaction.objectStore('cards');
            objectStore.clear(); // 全て削除してから保存

            document.querySelectorAll('.character-card').forEach(card => {
                const cardData = {
                    id: card.dataset.id,
                    name: card.querySelector('.character-name').innerHTML,
                    rank: card.querySelector('.character-rank').innerHTML,
                    rankTotal: card.querySelector('.ranking-text').innerHTML,
                    tier: card.querySelector('.character-rank[style*="background-color: #3b5998;"]').innerHTML,
                    stats: card.querySelector('.stats-table').innerHTML,
                    skills: card.querySelector('.skill-list').innerHTML,
                    image: card.querySelector('.card-image').src
                };
                objectStore.put(cardData);
            });
        }
        
        // カードを読み込み
        function loadCards() {
            const transaction = db.transaction('cards', 'readonly');
            const objectStore = transaction.objectStore('cards');
            const allCards = objectStore.getAll();

            allCards.onsuccess = (event) => {
                const savedCards = event.target.result;
                if (savedCards.length > 0) {
                    cardsContainer.innerHTML = '';
                    savedCards.forEach(data => addCard(data));
                } else {
                    addCard(); // データがない場合は初期テンプレートを表示
                }
            };
        }

        // 画像の変更処理
        function handleImageChange(event) {
            const file = event.target.files[0];
            const card = event.target.closest('.character-card');
            const cardImage = card.querySelector('.card-image');

            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    cardImage.src = e.target.result;
                    saveCard(card);
                };
                reader.readAsDataURL(file);
            }
        }

        // 個別カードの保存
        function saveCard(card) {
            const transaction = db.transaction('cards', 'readwrite');
            const objectStore = transaction.objectStore('cards');
            const cardData = {
                id: card.dataset.id,
                name: card.querySelector('.character-name').innerHTML,
                rank: card.querySelector('.character-rank').innerHTML,
                rankTotal: card.querySelector('.ranking-text').innerHTML,
                tier: card.querySelector('.character-rank[style*="background-color: #3b5998;"]').innerHTML,
                stats: card.querySelector('.stats-table').innerHTML,
                skills: card.querySelector('.skill-list').innerHTML,
                image: card.querySelector('.card-image').src
            };
            objectStore.put(cardData);
        }

        // カードの削除
        function deleteCard(button) {
            const card = button.closest('.character-card');
            const cardId = card.dataset.id;
            
            const transaction = db.transaction('cards', 'readwrite');
            const objectStore = transaction.objectStore('cards');
            objectStore.delete(cardId);
            
            card.remove();
        }

        window.addCard = addCard;
        window.deleteCard = deleteCard;

        // 初期表示時にカードを読み込み
        loadCards();
    </script>
</body>
</html>
