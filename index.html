<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター評価</title>
    <style>
        body {
            font-family: -apple-system, Blink-Mac-System, "Helvetica Neue", "Segoe UI", YuGothic, "Yu Gothic", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .character-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            border: 3px solid #f9d71c;
            position: relative;
            background-color: #e0e0e0;
            cursor: pointer;
        }
        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .character-image::after {
            display: none; /* ここを変更しました */
            content: attr(data-rank);
            position: absolute;
            bottom: -5px;
            right: -5px;
            background-color: #a42c2c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 12px;
            border: 2px solid white;
            line-height: 1;
        }
        .character-name {
            font-size: 28px;
            font-weight: bold;
            color: #4a4a4a;
        }
        .character-rank {
            background-color: #a42c2c;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-left: 10px;
            /* 遷移を滑らかにする */
            transition: background-color 0.3s ease;
        }
        
        /* ランクごとの色分けを追加 */
        .character-rank.rank-ss {
            background-color: #a42c2c !important; /* 赤 */
        }
        .character-rank.rank-s {
            background-color: #e67e22 !important; /* 橙 */
        }
        .character-rank.rank-a {
            background-color: #f1c40f !important; /* 黄 */
        }
        .character-rank.rank-b {
            background-color: #2ecc71 !important; /* 緑 */
        }
        .character-rank.rank-c {
            background-color: #3498db !important; /* 青 */
        }
        .character-rank.rank-d {
            background-color: #9b59b6 !important; /* 紫 */
        }
        .character-rank.rank-e {
            background-color: #bdc3c7 !important; /* 灰 */
        }

        .ranking-text {
            font-size: 18px;
            color: #777;
            margin-left: 10px;
        }
        .stats-table {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            text-align: center;
        }
        .stats-item {
            flex: 1;
            padding: 8px;
        }
        .stats-item:first-child {
            background-color: #c9c9c9;
            font-weight: bold;
        }
        .stats-item .label {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .stats-item .value {
            font-size: 20px;
            font-weight: bold;
        }
        .skill-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skill-list li {
            position: relative;
            padding-left: 1.5em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .skill-list li::before {
            content: '・';
            position: absolute;
            left: 0;
            color: #4a4a4a;
        }
        .image-input {
            display: none;
        }
        .add-button {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        .add-button:hover {
            background-color: #45a049;
        }
        /* 削除ボタンを透明にして見えなくする */
        .delete-button {
            position: absolute;
            top: 0;
            right: 0;
            width: 50px; /* タップしやすいように大きさを確保 */
            height: 50px;
            background-color: transparent; /* 背景を透明に */
            color: transparent; /* 文字色を透明に */
            border: none;
            cursor: pointer;
            z-index: 10; /* 他の要素の上に配置 */
        }
        .card-template {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="character-card-list">
        </div>
    <button class="add-button" id="add-card-button">カードを追加</button>
</div>

<div id="card-template" class="character-card card-template">
    <button class="delete-button" title="カードを削除">削除</button>
    <div class="card-header">
        <div class="character-image" data-rank="?">
            <img src="" alt="" class="card-image">
        </div>
        <div>
            <div class="character-name" contenteditable="true">キャラクター名</div>
            <div style="display: flex; align-items: baseline;">
                <span class="character-rank" contenteditable="true">?位</span>
                <span class="ranking-text" contenteditable="true">/??位</span>
                <span class="character-rank" style="background-color: #3b5998;" contenteditable="true">?</span>
            </div>
        </div>
    </div>
    <label class="image-input">画像を選択</label>
    <input type="file" style="display: none;" accept="image/*" class="image-file-input">
    <div class="stats-table">
        <div class="stats-item">
            <div class="label">耐久</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">攻撃</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">安定性</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">機動力</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">援護</div>
            <div class="value" contenteditable="true">?</div>
        </div>
    </div>
    <ul class="skill-list">
        <li contenteditable="true">スキルや評価を入力してください</li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
    </ul>
</div>

<script>
    const dbName = 'characterDB';
    const dbVersion = 3; 
    let db;

    const request = indexedDB.open(dbName, dbVersion);

    request.onerror = (event) => {
        console.error('IndexedDB error:', event.target.errorCode);
    };

    request.onupgradeneeded = (event) => {
        db = event.target.result;
        if (!db.objectStoreNames.contains('cardData')) {
            db.createObjectStore('cardData');
        }
        const cardOrderStore = db.createObjectStore('cardOrder');
    };

    request.onsuccess = (event) => {
        db = event.target.result;
        loadAllCards();
    };

    function saveCardData(cardId, key, value) {
        const transaction = db.transaction('cardData', 'readwrite');
        const objectStore = transaction.objectStore('cardData');
        objectStore.put(value, `${cardId}_${key}`);
    }

    function loadCardData(cardId, key, element) {
        const transaction = db.transaction('cardData', 'readonly');
        const objectStore = transaction.objectStore('cardData');
        const request = objectStore.get(`${cardId}_${key}`);
        request.onsuccess = (event) => {
            const savedData = event.target.result;
            if (savedData !== undefined) {
                if (key === 'image') {
                    element.src = savedData;
                } else {
                    element.innerHTML = savedData;
                    // ランクの要素の場合、色を更新
                    if (element.classList.contains('character-rank')) {
                        updateRankColor(element);
                    }
                }
            }
        };
    }

    function deleteCardData(cardId) {
        const transaction = db.transaction('cardData', 'readwrite');
        const objectStore = transaction.objectStore('cardData');
        
        const request = objectStore.openCursor();
        request.onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor) {
                if (cursor.key.startsWith(`${cardId}_`)) {
                    cursor.delete();
                }
                cursor.continue();
            }
        };
    }

    function updateRankColor(element) {
        const text = element.textContent.trim().toUpperCase();
        const rankClasses = ['rank-ss', 'rank-s', 'rank-a', 'rank-b', 'rank-c', 'rank-d', 'rank-e'];
        
        // 既存のランククラスをすべて削除
        element.classList.remove(...rankClasses);

        let rank = '';
        if (text.includes('SS')) {
            rank = 'ss';
        } else if (text.includes('S')) {
            rank = 's';
        } else if (text.includes('A')) {
            rank = 'a';
        } else if (text.includes('B')) {
            rank = 'b';
        } else if (text.includes('C')) {
            rank = 'c';
        } else if (text.includes('D')) {
            rank = 'd';
        } else if (text.includes('E')) {
            rank = 'e';
        }

        if (rank) {
            element.classList.add(`rank-${rank}`);
        }
    }

    function setupCardEventListeners(cardElement, cardId) {
        const editableElements = cardElement.querySelectorAll('[contenteditable="true"]');
        editableElements.forEach((elem, index) => {
            elem.addEventListener('input', (e) => {
                saveCardData(cardId, `text_${index}`, e.target.innerHTML);
                // ランクの要素の場合、色を更新
                if (e.target.classList.contains('character-rank')) {
                    updateRankColor(e.target);
                }
            });
        });

        const fileInput = cardElement.querySelector('.image-file-input');
        const imgContainer = cardElement.querySelector('.character-image');
        const imgElement = cardElement.querySelector('.card-image');

        imgContainer.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imgElement.src = event.target.result;
                    saveCardData(cardId, 'image', event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });
        
        cardElement.querySelector('.delete-button').addEventListener('click', () => {
            if (confirm('このカードを本当に削除しますか？')) {
                deleteCard(cardId, cardElement);
            }
        });
    }

    function createCard(isNew = true) {
        const template = document.getElementById('card-template');
        const cardClone = template.cloneNode(true);
        cardClone.classList.remove('card-template');
        
        const newCardId = `card_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        cardClone.setAttribute('data-card-id', newCardId);
        
        setupCardEventListeners(cardClone, newCardId);
        document.getElementById('character-card-list').appendChild(cardClone);

        if (isNew) {
            saveCardOrder();
        }
    }

    function loadCard(cardId) {
        const template = document.getElementById('card-template');
        const cardClone = template.cloneNode(true);
        cardClone.classList.remove('card-template');
        cardClone.setAttribute('data-card-id', cardId);

        setupCardEventListeners(cardClone, cardId);

        const editableElements = cardClone.querySelectorAll('[contenteditable="true"]');
        editableElements.forEach((elem, index) => {
            loadCardData(cardId, `text_${index}`, elem);
        });
        loadCardData(cardId, 'image', cardClone.querySelector('.card-image'));
        
        document.getElementById('character-card-list').appendChild(cardClone);
    }

    function deleteCard(cardId, cardElement) {
        cardElement.remove();
        deleteCardData(cardId);
        saveCardOrder();
    }

    function saveCardOrder() {
        const cardIds = Array.from(document.querySelectorAll('.character-card:not(.card-template)')).map(card => card.getAttribute('data-card-id'));
        const transaction = db.transaction('cardOrder', 'readwrite');
        const objectStore = transaction.objectStore('cardOrder');
        objectStore.put(cardIds, 'order');
    }

    function loadAllCards() {
        const transaction = db.transaction('cardOrder', 'readonly');
        const objectStore = transaction.objectStore('cardOrder');
        const request = objectStore.get('order');

        request.onsuccess = (event) => {
            const cardIds = event.target.result;
            if (cardIds && cardIds.length > 0) {
                document.getElementById('character-card-list').innerHTML = '';
                cardIds.forEach(cardId => {
                    loadCard(cardId);
                });
            } else {
                for (let i = 0; i < 3; i++) {
                    createCard();
                }
            }
        };

        request.onerror = (event) => {
            console.error('Failed to load card order:', event.target.errorCode);
            for (let i = 0; i < 3; i++) {
                    createCard();
                }
        };
    }

    document.getElementById('add-card-button').addEventListener('click', () => createCard());
</script>
</body>
</html>
