<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター編集ツール</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background-color: #ccc;
            border-radius: 50%;
            margin-right: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header-content {
            flex-grow: 1;
        }
        .character-name-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .character-name-group h2 {
            font-size: 24px;
            margin: 0;
            margin-right: 10px;
        }
        .character-name-group input {
            font-size: 24px;
            font-weight: bold;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 4px 8px;
            width: calc(100% - 100px);
            max-width: 200px;
        }
        .rank-box {
            display: flex;
            align-items: center;
            font-size: 18px;
        }
        .rank {
            background-color: #d9534f;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            margin-right: 4px;
        }
        .total-rank {
            color: #333;
        }
        .rating-box {
            display: flex;
            justify-content: space-around;
            text-align: center;
            background-color: #f7f7f7;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        .rating-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rating-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }
        .rating-grade {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .skill-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skill-list li {
            margin-bottom: 10px;
        }
        .skill-list input,
        .skill-list textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            font-size: 16px;
            resize: vertical;
        }
        .add-card-button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .add-card-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" id="template-card" style="display: none;">
            <div class="header">
                <div class="avatar">
                    <img src="" alt="キャラクター画像" id="template-avatar-img">
                </div>
                <div class="header-content">
                    <div class="character-name-group">
                        <input type="text" placeholder="キャラクター名" id="template-character-name">
                    </div>
                    <div class="rank-box">
                        <span class="rank" id="template-rank">?位</span>
                        <span class="total-rank">/?位</span>
                    </div>
                </div>
            </div>
            <div class="rating-box">
                <div class="rating-item"><span class="rating-label">耐久</span><input type="text" class="rating-grade" placeholder="?" maxlength="2" id="template-durability"></div>
                <div class="rating-item"><span class="rating-label">攻撃</span><input type="text" class="rating-grade" placeholder="?" maxlength="2" id="template-attack"></div>
                <div class="rating-item"><span class="rating-label">安定性</span><input type="text" class="rating-grade" placeholder="?" maxlength="2" id="template-stability"></div>
                <div class="rating-item"><span class="rating-label">機動力</span><input type="text" class="rating-grade" placeholder="?" maxlength="2" id="template-mobility"></div>
                <div class="rating-item"><span class="rating-label">援護</span><input type="text" class="rating-grade" placeholder="?" maxlength="2" id="template-support"></div>
            </div>
            <ul class="skill-list">
                <li><textarea rows="2" placeholder="スキルや評価を入力してください" id="template-skill-1"></textarea></li>
                <li><textarea rows="2" placeholder="スキルや評価を入力してください" id="template-skill-2"></textarea></li>
                <li><textarea rows="2" placeholder="スキルや評価を入力してください" id="template-skill-3"></textarea></li>
            </ul>
        </div>

        <div id="card-container"></div>

        <button class="add-card-button" id="add-card">カードを追加</button>

    </div>

    <script>
        const cardContainer = document.getElementById('card-container');
        const addCardButton = document.getElementById('add-card');
        const templateCard = document.getElementById('template-card');

        // カードをローカルストレージに保存する関数
        function saveCards() {
            const cards = [];
            document.querySelectorAll('.card').forEach(card => {
                const data = {
                    id: card.getAttribute('data-id'),
                    name: card.querySelector('.character-name-group input').value,
                    rank: card.querySelector('.rank').textContent,
                    durability: card.querySelector('.rating-item:nth-child(1) input').value,
                    attack: card.querySelector('.rating-item:nth-child(2) input').value,
                    stability: card.querySelector('.rating-item:nth-child(3) input').value,
                    mobility: card.querySelector('.rating-item:nth-child(4) input').value,
                    support: card.querySelector('.rating-item:nth-child(5) input').value,
                    skill1: card.querySelector('.skill-list li:nth-child(1) textarea').value,
                    skill2: card.querySelector('.skill-list li:nth-child(2) textarea').value,
                    skill3: card.querySelector('.skill-list li:nth-child(3) textarea').value,
                };
                cards.push(data);
            });
            localStorage.setItem('characterCards', JSON.stringify(cards));
        }

        // 新しいカードを追加する関数
        function addCard(data = null) {
            const newCard = templateCard.cloneNode(true);
            const cardId = 'card-' + Date.now();
            newCard.id = cardId;
            newCard.style.display = 'block';
            newCard.removeAttribute('data-id');
            newCard.setAttribute('data-id', cardId);

            const avatarImg = newCard.querySelector('.avatar img');
            const characterNameInput = newCard.querySelector('.character-name-group input');
            const rankSpan = newCard.querySelector('.rank');
            const durabilityInput = newCard.querySelector('.rating-item:nth-child(1) input');
            const attackInput = newCard.querySelector('.rating-item:nth-child(2) input');
            const stabilityInput = newCard.querySelector('.rating-item:nth-child(3) input');
            const mobilityInput = newCard.querySelector('.rating-item:nth-child(4) input');
            const supportInput = newCard.querySelector('.rating-item:nth-child(5) input');
            const skill1Textarea = newCard.querySelector('.skill-list li:nth-child(1) textarea');
            const skill2Textarea = newCard.querySelector('.skill-list li:nth-child(2) textarea');
            const skill3Textarea = newCard.querySelector('.skill-list li:nth-child(3) textarea');

            if (data) {
                characterNameInput.value = data.name;
                rankSpan.textContent = data.rank;
                durabilityInput.value = data.durability;
                attackInput.value = data.attack;
                stabilityInput.value = data.stability;
                mobilityInput.value = data.mobility;
                supportInput.value = data.support;
                skill1Textarea.value = data.skill1;
                skill2Textarea.value = data.skill2;
                skill3Textarea.value = data.skill3;
            }

            // 画像アップロード機能の追加
            avatarImg.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            avatarImg.src = e.target.result;
                            saveCards();
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            });

            newCard.querySelectorAll('input, textarea').forEach(input => {
                input.addEventListener('input', saveCards);
            });

            cardContainer.appendChild(newCard);
        }

        // ページ読み込み時にローカルストレージからデータをロードする
        function loadCards() {
            const savedCards = JSON.parse(localStorage.getItem('characterCards'));
            if (savedCards && savedCards.length > 0) {
                savedCards.forEach(data => addCard(data));
            } else {
                addCard(); // データがなければ空のカードを1枚追加
            }
        }

        addCardButton.addEventListener('click', () => addCard());

        window.onload = loadCards;
    </script>

</body>
</html>
