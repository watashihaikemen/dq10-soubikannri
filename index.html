<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター評価</title>
    <style>
        body {
            font-family: -apple-system, Blink-Mac-System, "Helvetica Neue", "Segoe UI", YuGothic, "Yu Gothic", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .character-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            border: 3px solid #f9d71c;
            position: relative;
            background-color: #e0e0e0;
            cursor: pointer;
        }
        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .character-image::after {
            display: none;
            content: attr(data-rank);
            position: absolute;
            bottom: -5px;
            right: -5px;
            background-color: #a42c2c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 12px;
            border: 2px solid white;
            line-height: 1;
        }
        .character-name {
            font-size: 28px;
            font-weight: bold;
            color: #4a4a4a;
        }

        /* ランクの色を定義するCSSクラス */
        .rank-ss { background-color: #d63031 !important; } /* 赤 */
        .rank-s { background-color: #e67e22 !important; }  /* 橙 */
        .rank-a { background-color: #f1c40f !important; }  /* 黄 */
        .rank-b { background-color: #27ae60 !important; }  /* 緑 */
        .rank-c { background-color: #3498db !important; }  /* 青 */
        .rank-d { background-color: #9b59b6 !important; }  /* 紫 */
        .rank-e { background-color: #34495e !important; }  /* 濃い青 */
        .rank-default { background-color: #a42c2c !important; } /* デフォルト色 */

        .character-rank {
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-left: 10px;
        }
        .ranking-text {
            font-size: 18px;
            color: #777;
            margin-left: 10px;
        }
        .stats-table {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            text-align: center;
        }
        .stats-item {
            flex: 1;
            padding: 8px;
        }
        .stats-item:first-child {
            background-color: #c9c9c9;
            font-weight: bold;
        }
        .stats-item .label {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .stats-item .value {
            font-size: 20px;
            font-weight: bold;
        }
        .skill-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skill-list li {
            position: relative;
            padding-left: 1.5em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .skill-list li::before {
            content: '・';
            position: absolute;
            left: 0;
            color: #4a4a4a;
        }
        .image-input {
            display: none;
        }
        .add-button {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        .add-button:hover {
            background-color: #45a049;
        }
        .delete-button {
            position: absolute;
            top: 0;
            right: 0;
            width: 50px;
            height: 50px;
            background-color: transparent;
            color: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
        .card-template {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="character-card-list">
    </div>
    <button class="add-button" id="add-card-button">カードを追加</button>
</div>

<div id="card-template" class="character-card card-template">
    <button class="delete-button" title="カードを削除">削除</button>
    <div class="card-header">
        <div class="character-image" data-rank="?">
            <img src="" alt="" class="card-image">
        </div>
        <div>
            <div class="character-name" contenteditable="true">キャラクター名</div>
            <div style="display: flex; align-items: baseline;">
                <span class="character-rank" contenteditable="true">?</span>
                <span class="ranking-text" contenteditable="true">/??位</span>
                <span class="character-rank" style="background-color: #3b5998;" contenteditable="true">?</span>
            </div>
        </div>
    </div>
    <label class="image-input">画像を選択</label>
    <input type="file" style="display: none;" accept="image/*" class="image-file-input">
    <div class="stats-table">
        <div class="stats-item">
            <div class="label">耐久</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">攻撃</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">安定性</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">機動力</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">援護</div>
            <div class="value" contenteditable="true">?</div>
        </div>
    </div>
    <ul class="skill-list">
        <li contenteditable="true">スキルや評価を入力してください</li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
    </ul>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const dbName = 'characterDB';
        const dbVersion = 3;
        let db;
        const characterCardList = document.getElementById('character-card-list');
        const addCardButton = document.getElementById('add-card-button');
        const cardTemplate = document.getElementById('card-template');

        const request = indexedDB.open(dbName, dbVersion);

        request.onerror = (event) => {
            console.error('IndexedDB error:', event.target.errorCode);
        };

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains('cardData')) {
                db.createObjectStore('cardData');
            }
            if (!db.objectStoreNames.contains('cardOrder')) {
                db.createObjectStore('cardOrder');
            }
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            loadAllCards();
        };

        function saveCardData(cardId, key, value) {
            if (!db) return;
            const transaction = db.transaction('cardData', 'readwrite');
            const objectStore = transaction.objectStore('cardData');
            objectStore.put(value, `${cardId}_${key}`);
        }

        function loadCardData(cardId, key, element) {
            return new Promise((resolve) => {
                if (!db) {
                    resolve();
                    return;
                }
                const transaction = db.transaction('cardData', 'readonly');
                const objectStore = transaction.objectStore('cardData');
                const request = objectStore.get(`${cardId}_${key}`);
                
                request.onsuccess = (event) => {
                    const savedData = event.target.result;
                    if (savedData !== undefined) {
                        if (key === 'image') {
                            element.src = savedData;
                        } else {
                            element.innerHTML = savedData;
                        }
                    }
                    resolve();
                };
                request.onerror = () => {
                    resolve();
                };
            });
        }

        function deleteCardData(cardId) {
            if (!db) return;
            const transaction = db.transaction('cardData', 'readwrite');
            const objectStore = transaction.objectStore('cardData');
            
            const request = objectStore.openCursor();
            request.onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    if (cursor.key.startsWith(`${cardId}_`)) {
                        cursor.delete();
                    }
                    cursor.continue();
                }
            };
        }

        function updateRankColor(rankElement) {
            const rankValue = rankElement.innerText.toUpperCase().trim().replace(/位$/, '');
            rankElement.classList.remove('rank-ss', 'rank-s', 'rank-a', 'rank-b', 'rank-c', 'rank-d', 'rank-e', 'rank-default');

            switch (rankValue) {
                case 'SS': rankElement.classList.add('rank-ss'); break;
                case 'S': rankElement.classList.add('rank-s'); break;
                case 'A': rankElement.classList.add('rank-a'); break;
                case 'B': rankElement.classList.add('rank-b'); break;
                case 'C': rankElement.classList.add('rank-c'); break;
                case 'D': rankElement.classList.add('rank-d'); break;
                case 'E': rankElement.classList.add('rank-e'); break;
                default: rankElement.classList.add('rank-default');
            }
        }

        function setupCardEventListeners(cardElement, cardId) {
            const elements = {
                name: cardElement.querySelector('.character-name'),
                rank1: cardElement.querySelectorAll('.character-rank')[0],
                rankingText: cardElement.querySelector('.ranking-text'),
                rank2: cardElement.querySelectorAll('.character-rank')[1],
                stats: cardElement.querySelectorAll('.stats-item .value'),
                skills: cardElement.querySelectorAll('.skill-list li'),
                imageInput: cardElement.querySelector('.image-file-input'),
                imgContainer: cardElement.querySelector('.character-image'),
                imgElement: cardElement.querySelector('.card-image'),
                deleteButton: cardElement.querySelector('.delete-button')
            };

            elements.name.addEventListener('input', () => saveCardData(cardId, 'name', elements.name.innerHTML));
            elements.rank1.addEventListener('input', () => {
                saveCardData(cardId, 'rank1', elements.rank1.innerHTML);
                updateRankColor(elements.rank1);
            });
            elements.rankingText.addEventListener('input', () => saveCardData(cardId, 'ranking_text', elements.rankingText.innerHTML));
            elements.rank2.addEventListener('input', () => {
                saveCardData(cardId, 'rank2', elements.rank2.innerHTML);
                updateRankColor(elements.rank2);
            });
            elements.stats.forEach((elem, index) => {
                elem.addEventListener('input', () => saveCardData(cardId, `stat_${index}`, elem.innerHTML));
            });
            elements.skills.forEach((elem, index) => {
                elem.addEventListener('input', () => saveCardData(cardId, `skill_${index}`, elem.innerHTML));
            });

            elements.imgContainer.addEventListener('click', () => elements.imageInput.click());
            elements.imageInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        elements.imgElement.src = event.target.result;
                        saveCardData(cardId, 'image', event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
            elements.deleteButton.addEventListener('click', () => {
                if (confirm('このカードを本当に削除しますか？')) {
                    deleteCard(cardId, cardElement);
                }
            });
        }

        async function createCard(isNew = true) {
            const cardClone = cardTemplate.cloneNode(true);
            cardClone.classList.remove('card-template');
            const newCardId = `card_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            cardClone.setAttribute('data-card-id', newCardId);

            if (isNew) {
                const initialData = {
                    name: 'キャラクター名', rank1: '?', ranking_text: '/??位', rank2: '?',
                    stats: ['?', '?', '?', '?', '?'],
                    skills: ['スキルや評価を入力してください', '', '', ''],
                    image: ''
                };
                
                cardClone.querySelector('.character-name').innerHTML = initialData.name;
                cardClone.querySelectorAll('.character-rank')[0].innerHTML = initialData.rank1;
                cardClone.querySelector('.ranking-text').innerHTML = initialData.ranking_text;
                cardClone.querySelectorAll('.character-rank')[1].innerHTML = initialData.rank2;
                cardClone.querySelector('.card-image').src = initialData.image;
                cardClone.querySelectorAll('.stats-item .value').forEach((el, i) => el.innerHTML = initialData.stats[i]);
                cardClone.querySelectorAll('.skill-list li').forEach((el, i) => el.innerHTML = initialData.skills[i]);
                
                updateRankColor(cardClone.querySelectorAll('.character-rank')[0]);
                updateRankColor(cardClone.querySelectorAll('.character-rank')[1]);

                saveCardData(newCardId, 'name', initialData.name);
                saveCardData(newCardId, 'rank1', initialData.rank1);
                saveCardData(newCardId, 'ranking_text', initialData.ranking_text);
                saveCardData(newCardId, 'rank2', initialData.rank2);
                initialData.stats.forEach((val, i) => saveCardData(newCardId, `stat_${i}`, val));
                initialData.skills.forEach((val, i) => saveCardData(newCardId, `skill_${i}`, val));
                saveCardData(newCardId, 'image', initialData.image);
            }

            characterCardList.appendChild(cardClone);
            setupCardEventListeners(cardClone, newCardId);
            saveCardOrder();
        }

        async function loadCard(cardId) {
            const cardClone = cardTemplate.cloneNode(true);
            cardClone.classList.remove('card-template');
            cardClone.setAttribute('data-card-id', cardId);

            setupCardEventListeners(cardClone, cardId);
            
            await Promise.all([
                loadCardData(cardId, 'name', cardClone.querySelector('.character-name')),
                loadCardData(cardId, 'rank1', cardClone.querySelectorAll('.character-rank')[0]),
                loadCardData(cardId, 'ranking_text', cardClone.querySelector('.ranking-text')),
                loadCardData(cardId, 'rank2', cardClone.querySelectorAll('.character-rank')[1]),
                loadCardData(cardId, 'image', cardClone.querySelector('.card-image')),
                ...Array.from(cardClone.querySelectorAll('.stats-item .value')).map((el, i) => loadCardData(cardId, `stat_${i}`, el)),
                ...Array.from(cardClone.querySelectorAll('.skill-list li')).map((el, i) => loadCardData(cardId, `skill_${i}`, el))
            ]);

            characterCardList.appendChild(cardClone);
            updateRankColor(cardClone.querySelectorAll('.character-rank')[0]);
            updateRankColor(cardClone.querySelectorAll('.character-rank')[1]);
        }

        function deleteCard(cardId, cardElement) {
            cardElement.remove();
            deleteCardData(cardId);
            saveCardOrder();
        }

        function saveCardOrder() {
            if (!db) return;
            const cardIds = Array.from(document.querySelectorAll('.character-card:not(.card-template)')).map(card => card.getAttribute('data-card-id'));
            const transaction = db.transaction('cardOrder', 'readwrite');
            const objectStore = transaction.objectStore('cardOrder');
            objectStore.put(cardIds, 'order');
        }

        async function loadAllCards() {
            if (!db) return;
            const transaction = db.transaction('cardOrder', 'readonly');
            const objectStore = transaction.objectStore('cardOrder');
            const request = objectStore.get('order');

            request.onsuccess = async (event) => {
                const cardIds = event.target.result;
                characterCardList.innerHTML = '';
                if (cardIds && cardIds.length > 0) {
                    for (const cardId of cardIds) {
                        await loadCard(cardId);
                    }
                } else {
                    for (let i = 0; i < 3; i++) {
                        await createCard();
                    }
                }
            };
        }

        addCardButton.addEventListener('click', () => createCard(true));
    });
</script>
</body>
</html>
