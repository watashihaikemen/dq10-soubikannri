<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクターカードクリエイター</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .card-creator {
            max-width: 800px;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        #form-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .form-row label {
            font-weight: bold;
            flex: 1;
        }

        .form-row input, .form-row select, .form-row textarea {
            flex: 2;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        #image-preview-container {
            flex: 2;
            display: flex;
            align-items: center;
        }
        #image-preview {
            width: 50px;
            height: 50px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            object-fit: contain;
        }

        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .card-container {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .character-card {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-header {
            background-color: #f5f5f5;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ランクごとの文字色 */
        .rank-SS { color: #ff8c00; } /* 橙 */
        .rank-S { color: #ffd700; }  /* 黄 */
        .rank-A { color: #dc143c; }  /* 赤 */
        .rank-B { color: #2e8b57; }  /* 緑 */
        .rank-C { color: #0000ff; }  /* 青 */
        .rank-D { color: #8a2be2; }  /* 紫 */
        .rank-E { color: #191970; }  /* 濃い青 */
        
        /* ステータスセルの文字色 */
        .card-stats td {
            font-weight: bold;
        }

        .card-header .char-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 4px;
        }

        .card-header .char-details {
            flex: 1;
            margin-left: 15px;
        }

        .card-name {
            font-size: 24px;
            font-weight: bold;
        }

        .card-ranking {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        
        .card-position {
            font-size: 14px;
            color: #333;
            font-weight: normal;
        }

        .card-rank {
            font-size: 16px;
            font-weight: bold;
        }

        .card-stats table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
        }

        .card-stats th, .card-stats td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        .card-stats th {
            background-color: #eee;
        }

        .card-description {
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
        }
        
        /* 説明文の箇条書きのインデントを調整 */
        .card-description ul {
            padding-left: 15px;
            margin: 0;
        }
        .card-description li {
            padding-left: 5px;
        }

        .card-actions {
            padding: 10px;
            text-align: right;
        }

        .card-actions button {
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="card-creator">
        <h1>キャラクターカードクリエイター</h1>
        <div id="form-container">
            <form id="card-form">
                <div class="form-row">
                    <label for="char-image-upload">キャラクター画像:</label>
                    <div id="image-preview-container">
                        <img id="image-preview" src="" alt="画像プレビュー" style="display:none;">
                        <input type="file" id="char-image-upload" accept="image/*">
                    </div>
                </div>
                <div class="form-row">
                    <label for="char-name">キャラクター名:</label>
                    <input type="text" id="char-name" name="char-name" required>
                </div>
                <div class="form-row">
                    <label for="char-position">順位:</label>
                    <input type="number" id="char-position" name="char-position" min="1" required>
                </div>
                <div class="form-row">
                    <label for="char-rank">総合評価:</label>
                    <select id="char-rank" name="char-rank">
                        <option value="SS">SS</option>
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-endurance">耐久:</label>
                    <select id="status-endurance" name="status-endurance">
                        <option value="SS">SS</option>
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-attack">攻撃:</label>
                    <select id="status-attack" name="status-attack">
                        <option value="SS">SS</option>
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-stability">安定性:</label>
                    <select id="status-stability" name="status-stability">
                        <option value="SS">SS</option>
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-mobility">機動力:</label>
                    <select id="status-mobility" name="status-mobility">
                        <option value="SS">SS</option>
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-support">援護:</label>
                    <select id="status-support" name="status-support">
                        <option value="SS">SS</option>
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="char-description">説明:</label>
                    <textarea id="char-description" name="char-description"></textarea>
                </div>
                <button type="submit" id="submit-button">カードを作成</button>
            </form>
        </div>

        <div id="card-list">
            </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('card-form');
            const cardList = document.getElementById('card-list');
            const imageUpload = document.getElementById('char-image-upload');
            const imagePreview = document.getElementById('image-preview');
            let editingCardData = null;

            const savedCards = JSON.parse(localStorage.getItem('characterCards')) || [];
            if (savedCards.length > 0) {
                savedCards.forEach(data => createCardElement(data));
                sortCards();
            }

            imageUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const imageDataURL = imagePreview.src;
                const charPosition = parseInt(form['char-position'].value);
                
                if (!imageDataURL || isNaN(charPosition)) {
                    alert('画像と順位の両方を入力してください。');
                    return;
                }

                const data = {
                    image: imageDataURL,
                    name: form['char-name'].value,
                    position: charPosition,
                    rank: form['char-rank'].value,
                    stats: {
                        endurance: form['status-endurance'].value,
                        attack: form['status-attack'].value,
                        stability: form['status-stability'].value,
                        mobility: form['status-mobility'].value,
                        support: form['status-support'].value,
                    },
                    description: form['char-description'].value,
                };

                if (editingCardData) {
                    const cardIndex = savedCards.findIndex(c => c.name === editingCardData.name);
                    if (cardIndex > -1) {
                        savedCards[cardIndex] = data;
                    }
                    const cardElement = document.querySelector(`.card-container[data-position="${editingCardData.position}"]`);
                    updateCardElement(cardElement, data);
                    editingCardData = null;
                    document.getElementById('submit-button').textContent = 'カードを更新';
                } else {
                    savedCards.push(data);
                    createCardElement(data);
                }

                localStorage.setItem('characterCards', JSON.stringify(savedCards));
                
                form.reset();
                imagePreview.style.display = 'none';
                imagePreview.src = '';
                sortCards();
            });

            function updateCardCount() {
                const totalCards = savedCards.length;
                const cards = document.querySelectorAll('.character-card');
                cards.forEach(card => {
                    const positionSpan = card.querySelector('.card-position');
                    if (positionSpan) {
                        const currentPosition = card.dataset.position;
                        positionSpan.textContent = `${currentPosition}位/${totalCards}位`;
                    }
                });
            }

            function sortCards() {
                savedCards.sort((a, b) => a.position - b.position);
                
                cardList.innerHTML = '';
                savedCards.forEach(data => createCardElement(data));
                
                updateCardCount();
            }

            function createCardElement(data) {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                cardContainer.dataset.position = data.position;
                
                const card = document.createElement('div');
                card.className = 'character-card';
                card.dataset.position = data.position;
                card.innerHTML = `
                    <div class="card-header">
                        <img src="${data.image}" alt="${data.name}" class="char-image">
                        <div class="char-details">
                            <div class="card-name">${data.name}</div>
                            <div class="card-ranking">
                                <span class="card-position">${data.position}位/0位</span>
                                <span class="card-rank rank-${data.rank}">総合評価:${data.rank}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-stats">
                        <table>
                            <thead>
                                <tr>
                                    <th>耐久</th>
                                    <th>攻撃</th>
                                    <th>安定性</th>
                                    <th>機動力</th>
                                    <th>援護</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><span class="rank-${data.stats.endurance}">${data.stats.endurance}</span></td>
                                    <td><span class="rank-${data.stats.attack}">${data.stats.attack}</span></td>
                                    <td><span class="rank-${data.stats.stability}">${data.stats.stability}</span></td>
                                    <td><span class="rank-${data.stats.mobility}">${data.stats.mobility}</span></td>
                                    <td><span class="rank-${data.stats.support}">${data.stats.support}</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-description">
                        <ul>
                            <li>${data.description.split('\n').join('</li><li>')}</li>
                        </ul>
                    </div>
                `;

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                actions.innerHTML = `
                    <button class="edit-button">編集</button>
                    <button class="delete-button">削除</button>
                `;

                actions.querySelector('.edit-button').addEventListener('click', () => {
                    startEditing(data);
                });

                actions.querySelector('.delete-button').addEventListener('click', () => {
                    deleteCard(cardContainer, data);
                });

                cardContainer.appendChild(card);
                cardContainer.appendChild(actions);
                cardList.appendChild(cardContainer);
            }

            function updateCardElement(cardContainer, data) {
                const card = cardContainer.querySelector('.character-card');
                card.dataset.position = data.position;
                card.querySelector('.char-image').src = data.image;
                card.querySelector('.card-name').textContent = data.name;
                
                const rankSpan = card.querySelector('.card-rank');
                rankSpan.className = `card-rank rank-${data.rank}`;
                rankSpan.textContent = `総合評価:${data.rank}`;
                
                card.querySelector('td:nth-child(1) span').className = `rank-${data.stats.endurance}`;
                card.querySelector('td:nth-child(1) span').textContent = data.stats.endurance;
                
                card.querySelector('td:nth-child(2) span').className = `rank-${data.stats.attack}`;
                card.querySelector('td:nth-child(2) span').textContent = data.stats.attack;

                card.querySelector('td:nth-child(3) span').className = `rank-${data.stats.stability}`;
                card.querySelector('td:nth-child(3) span').textContent = data.stats.stability;

                card.querySelector('td:nth-child(4) span').className = `rank-${data.stats.mobility}`;
                card.querySelector('td:nth-child(4) span').textContent = data.stats.mobility;

                card.querySelector('td:nth-child(5) span').className = `rank-${data.stats.support}`;
                card.querySelector('td:nth-child(5) span').textContent = data.stats.support;
                
                card.querySelector('.card-description ul').innerHTML = `<li>${data.description.split('\n').join('</li><li>')}</li>`;
                
                card.querySelector('.card-position').textContent = `${data.position}位/0位`;
            }

            function startEditing(data) {
                document.getElementById('char-name').value = data.name;
                document.getElementById('char-position').value = data.position;
                document.getElementById('char-rank').value = data.rank;
                document.getElementById('status-endurance').value = data.stats.endurance;
                document.getElementById('status-attack').value = data.stats.attack;
                document.getElementById('status-stability').value = data.stats.stability;
                document.getElementById('status-mobility').value = data.stats.mobility;
                document.getElementById('status-support').value = data.stats.support;
                document.getElementById('char-description').value = data.description;
                
                imagePreview.src = data.image;
                imagePreview.style.display = 'block';

                editingCardData = data;
                document.getElementById('submit-button').textContent = 'カードを更新';
            }

            function deleteCard(cardContainer, data) {
                const cardIndex = savedCards.findIndex(c => c.name === data.name);
                if (cardIndex > -1) {
                    savedCards.splice(cardIndex, 1);
                }
                cardContainer.remove();
                localStorage.setItem('characterCards', JSON.stringify(savedCards));
                sortCards();
            }
        });
    </script>
</body>
</html>
