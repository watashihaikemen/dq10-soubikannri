<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクターカードクリエイター</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .card-creator {
            max-width: 800px;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        #form-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .form-row label {
            font-weight: bold;
            flex: 1;
        }

        .form-row input, .form-row select, .form-row textarea {
            flex: 2;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        #image-preview-container {
            flex: 2;
            display: flex;
            align-items: center;
        }
        #image-preview {
            width: 50px;
            height: 50px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            object-fit: contain;
        }

        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .character-card {
            width: 350px;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative; /* 順位の絶対位置指定のため */
        }

        .card-rank-display {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #007BFF;
            color: white;
            padding: 5px 10px;
            border-radius: 50%;
            font-weight: bold;
        }

        .card-header {
            background-color: #f5f5f5;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header .char-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 4px;
        }

        .card-header .char-details {
            flex: 1;
            margin-left: 15px;
        }

        .card-name {
            font-size: 24px;
            font-weight: bold;
        }

        .card-ranking {
            font-size: 16px;
            color: #ffc107;
            font-weight: bold;
        }

        .card-stats table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
        }

        .card-stats th, .card-stats td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        .card-stats th {
            background-color: #eee;
        }

        .card-description {
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .card-actions {
            padding: 10px;
            text-align: right;
        }

        .card-actions button {
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="card-creator">
        <h1>キャラクターカードクリエイター</h1>
        <div id="form-container">
            <form id="card-form">
                <div class="form-row">
                    <label for="char-image-upload">キャラクター画像:</label>
                    <div id="image-preview-container">
                        <img id="image-preview" src="" alt="画像プレビュー" style="display:none;">
                        <input type="file" id="char-image-upload" accept="image/*">
                    </div>
                </div>
                <div class="form-row">
                    <label for="char-name">キャラクター名:</label>
                    <input type="text" id="char-name" name="char-name" required>
                </div>
                <div class="form-row">
                    <label for="char-position">順位:</label>
                    <input type="number" id="char-position" name="char-position" min="1" required>
                </div>
                <div class="form-row">
                    <label for="char-rank">ランク:</label>
                    <select id="char-rank" name="char-rank">
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-endurance">耐久:</label>
                    <select id="status-endurance" name="status-endurance">
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-attack">攻撃:</label>
                    <select id="status-attack" name="status-attack">
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-stability">安定性:</label>
                    <select id="status-stability" name="status-stability">
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-mobility">機動力:</label>
                    <select id="status-mobility" name="status-mobility">
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status-support">援護:</label>
                    <select id="status-support" name="status-support">
                        <option value="S">S</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="char-description">説明:</label>
                    <textarea id="char-description" name="char-description"></textarea>
                </div>
                <button type="submit" id="submit-button">カードを作成</button>
            </form>
        </div>

        <div id="card-list">
            </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('card-form');
            const cardList = document.getElementById('card-list');
            const imageUpload = document.getElementById('char-image-upload');
            const imagePreview = document.getElementById('image-preview');
            let editingCard = null;

            imageUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const imageDataURL = imagePreview.src;
                const charPosition = parseInt(form['char-position'].value);
                
                if (!imageDataURL || !charPosition) {
                    alert('画像と順位の両方を入力してください。');
                    return;
                }

                const data = {
                    image: imageDataURL,
                    name: form['char-name'].value,
                    position: charPosition,
                    rank: form['char-rank'].value,
                    stats: {
                        endurance: form['status-endurance'].value,
                        attack: form['status-attack'].value,
                        stability: form['status-stability'].value,
                        mobility: form['status-mobility'].value,
                        support: form['status-support'].value,
                    },
                    description: form['char-description'].value,
                };

                if (editingCard) {
                    updateCard(editingCard, data);
                    editingCard = null;
                    document.getElementById('submit-button').textContent = 'カードを作成';
                } else {
                    createCard(data);
                }

                form.reset();
                imagePreview.style.display = 'none';
                imagePreview.src = '';
                sortCards(); // カードの並び替え
            });

            function updateCardCount() {
                const totalCards = cardList.children.length;
                const cards = document.querySelectorAll('.character-card');
                cards.forEach(card => {
                    const positionSpan = card.querySelector('.card-position');
                    if (positionSpan) {
                        const currentPosition = card.dataset.position;
                        positionSpan.textContent = `${currentPosition}位/${totalCards}位`;
                    }
                });
            }

            function sortCards() {
                const cards = Array.from(cardList.children);
                cards.sort((a, b) => {
                    const posA = parseInt(a.dataset.position);
                    const posB = parseInt(b.dataset.position);
                    return posA - posB;
                });
                
                cards.forEach(card => cardList.appendChild(card));
                updateCardCount();
            }

            function createCard(data) {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.dataset.position = data.position; // 順位をデータ属性として保存
                card.innerHTML = `
                    <div class="card-header">
                        <img src="${data.image}" alt="${data.name}" class="char-image">
                        <div class="char-details">
                            <div class="card-name">${data.name}</div>
                            <div class="card-ranking">
                                <span class="card-position">${data.position}位/0位</span>
                                <span class="card-rank">${data.rank}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-stats">
                        <table>
                            <thead>
                                <tr>
                                    <th>耐久</th>
                                    <th>攻撃</th>
                                    <th>安定性</th>
                                    <th>機動力</th>
                                    <th>援護</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>${data.stats.endurance}</td>
                                    <td>${data.stats.attack}</td>
                                    <td>${data.stats.stability}</td>
                                    <td>${data.stats.mobility}</td>
                                    <td>${data.stats.support}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-description">
                        <ul>
                            <li>${data.description.split('\n').join('</li><li>')}</li>
                        </ul>
                    </div>
                    <div class="card-actions">
                        <button class="edit-button">編集</button>
                        <button class="delete-button">削除</button>
                    </div>
                `;

                card.querySelector('.edit-button').addEventListener('click', () => {
                    startEditing(card, data);
                });

                card.querySelector('.delete-button').addEventListener('click', () => {
                    deleteCard(card);
                });

                cardList.appendChild(card);
            }

            function updateCard(card, data) {
                card.querySelector('.char-image').src = data.image;
                card.querySelector('.card-name').textContent = data.name;
                card.querySelector('.card-rank').textContent = data.rank;
                card.querySelector('.card-stats td:nth-child(1)').textContent = data.stats.endurance;
                card.querySelector('.card-stats td:nth-child(2)').textContent = data.stats.attack;
                card.querySelector('.card-stats td:nth-child(3)').textContent = data.stats.stability;
                card.querySelector('.card-stats td:nth-child(4)').textContent = data.stats.mobility;
                card.querySelector('.card-stats td:nth-child(5)').textContent = data.stats.support;
                card.querySelector('.card-description ul').innerHTML = `<li>${data.description.split('\n').join('</li><li>')}</li>`;
                
                card.dataset.position = data.position;
                card.querySelector('.card-position').textContent = `${data.position}位/0位`;
                
                sortCards();
            }

            function startEditing(card, data) {
                document.getElementById('char-name').value = data.name;
                document.getElementById('char-position').value = card.dataset.position; // 編集時に順位をフォームにセット
                document.getElementById('char-rank').value = data.rank;
                document.getElementById('status-endurance').value = data.stats.endurance;
                document.getElementById('status-attack').value = data.stats.attack;
                document.getElementById('status-stability').value = data.stats.stability;
                document.getElementById('status-mobility').value = data.stats.mobility;
                document.getElementById('status-support').value = data.stats.support;
                document.getElementById('char-description').value = data.description;
                
                imagePreview.src = data.image;
                imagePreview.style.display = 'block';

                editingCard = card;
                document.getElementById('submit-button').textContent = 'カードを更新';
            }

            function deleteCard(card) {
                card.remove();
                sortCards(); // 削除後も並び替えと総枚数更新
            }
        });
    </script>
</body>
</html>
