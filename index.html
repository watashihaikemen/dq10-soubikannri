<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター評価</title>
    <style>
        body {
            font-family: -apple-system, BlinkMac-Mac-System, "Helvetica Neue", "Segoe UI", YuGothic, "Yu Gothic", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .character-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            border: 3px solid #f9d71c;
            position: relative;
            background-color: #e0e0e0;
            cursor: pointer;
        }
        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .character-image::after {
            display: none;
            content: attr(data-rank);
            position: absolute;
            bottom: -5px;
            right: -5px;
            background-color: #a42c2c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 12px;
            border: 2px solid white;
            line-height: 1;
        }
        .character-name {
            font-size: 28px;
            font-weight: bold;
            color: #4a4a4a;
        }
        .character-rank {
            background-color: #a42c2c;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-left: 10px;
        }
        .ranking-text {
            font-size: 18px;
            color: #777;
            margin-left: 10px;
        }
        .stats-table {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            text-align: center;
        }
        .stats-item {
            flex: 1;
            padding: 8px;
        }
        .stats-item:first-child {
            background-color: #c9c9c9;
            font-weight: bold;
        }
        .stats-item .label {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .stats-item .value {
            font-size: 20px;
            font-weight: bold;
        }
        .skill-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skill-list li {
            position: relative;
            padding-left: 1.5em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .skill-list li::before {
            content: '・';
            position: absolute;
            left: 0;
            color: #4a4a4a;
        }
        .image-input {
            display: none;
        }
        .add-button {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        .add-button:hover {
            background-color: #45a049;
        }
        .delete-button {
            position: absolute;
            top: 0;
            right: 0;
            width: 50px;
            height: 50px;
            background-color: transparent;
            color: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
        .card-template {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="character-card-list">
    </div>
    <button class="add-button" id="add-card-button">カードを追加</button>
</div>

<div id="card-template" class="character-card card-template">
    <button class="delete-button" title="カードを削除">削除</button>
    <div class="card-header">
        <div class="character-image" data-rank="?">
            <img src="" alt="" class="card-image">
        </div>
        <div>
            <div class="character-name" contenteditable="true">キャラクター名</div>
            <div style="display: flex; align-items: baseline;">
                <span class="character-rank" contenteditable="true">?位</span>
                <span class="ranking-text" contenteditable="true">/??位</span>
                <span class="character-rank" style="background-color: #3b5998;" contenteditable="true">?</span>
            </div>
        </div>
    </div>
    <label class="image-input">画像を選択</label>
    <input type="file" style="display: none;" accept="image/*" class="image-file-input">
    <div class="stats-table">
        <div class="stats-item">
            <div class="label">耐久</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">攻撃</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">安定性</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">機動力</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">援護</div>
            <div class="value" contenteditable="true">?</div>
        </div>
    </div>
    <ul class="skill-list">
        <li contenteditable="true">スキルや評価を入力してください</li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
    </ul>
</div>

<script>
    const dbName = 'characterDB_new';
    const dbVersion = 4;
    let db;

    const request = indexedDB.open(dbName, dbVersion);

    request.onupgradeneeded = (event) => {
        db = event.target.result;
        if (!db.objectStoreNames.contains('cardData')) {
            db.createObjectStore('cardData', { keyPath: 'id' });
        }
    };

    request.onerror = (event) => {
        console.error('IndexedDB error:', event.target.errorCode);
    };

    request.onsuccess = (event) => {
        db = event.target.result;
        loadAllCards();
    };

    function saveCard(cardId) {
        const cardElement = document.querySelector(`[data-card-id="${cardId}"]`);
        if (!cardElement) return;

        const cardData = {
            id: cardId,
            name: cardElement.querySelector('.character-name').innerHTML,
            rank: cardElement.querySelector('.character-rank:nth-of-type(1)').innerHTML,
            rankingText: cardElement.querySelector('.ranking-text').innerHTML,
            rankSecondary: cardElement.querySelector('.character-rank:nth-of-type(2)').innerHTML,
            durability: cardElement.querySelector('.stats-item:nth-of-type(1) .value').innerHTML,
            attack: cardElement.querySelector('.stats-item:nth-of-type(2) .value').innerHTML,
            stability: cardElement.querySelector('.stats-item:nth-of-type(3) .value').innerHTML,
            mobility: cardElement.querySelector('.stats-item:nth-of-type(4) .value').innerHTML,
            support: cardElement.querySelector('.stats-item:nth-of-type(5) .value').innerHTML,
            skills: Array.from(cardElement.querySelectorAll('.skill-list li')).map(li => li.innerHTML),
            image: cardElement.querySelector('.card-image').src
        };

        const transaction = db.transaction('cardData', 'readwrite');
        const objectStore = transaction.objectStore('cardData');
        objectStore.put(cardData);
    }

    function loadCard(cardData) {
        const template = document.getElementById('card-template');
        const cardClone = template.cloneNode(true);
        cardClone.classList.remove('card-template');
        cardClone.setAttribute('data-card-id', cardData.id);

        cardClone.querySelector('.character-name').innerHTML = cardData.name;
        cardClone.querySelector('.character-rank:nth-of-type(1)').innerHTML = cardData.rank;
        cardClone.querySelector('.ranking-text').innerHTML = cardData.rankingText;
        cardClone.querySelector('.character-rank:nth-of-type(2)').innerHTML = cardData.rankSecondary;
        cardClone.querySelector('.stats-item:nth-of-type(1) .value').innerHTML = cardData.durability;
        cardClone.querySelector('.stats-item:nth-of-type(2) .value').innerHTML = cardData.attack;
        cardClone.querySelector('.stats-item:nth-of-type(3) .value').innerHTML = cardData.stability;
        cardClone.querySelector('.stats-item:nth-of-type(4) .value').innerHTML = cardData.mobility;
        cardClone.querySelector('.stats-item:nth-of-type(5) .value').innerHTML = cardData.support;
        cardClone.querySelector('.card-image').src = cardData.image || '';

        const skillList = cardClone.querySelector('.skill-list');
        skillList.innerHTML = '';
        cardData.skills.forEach(skill => {
            const li = document.createElement('li');
            li.setAttribute('contenteditable', 'true');
            li.innerHTML = skill;
            skillList.appendChild(li);
        });

        setupCardEventListeners(cardClone, cardData.id);
        document.getElementById('character-card-list').appendChild(cardClone);
    }

    function createCard() {
        const newCardId = `card_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        const cardData = {
            id: newCardId,
            name: '新しいキャラクター',
            rank: '?位',
            rankingText: '/??位',
            rankSecondary: '?',
            durability: '?',
            attack: '?',
            stability: '?',
            mobility: '?',
            support: '?',
            skills: ['スキルや評価を入力してください', '', '', ''],
            image: ''
        };
        
        loadCard(cardData);
        saveCard(newCardId);
    }

    function deleteCard(cardId, cardElement) {
        if (confirm('このカードを本当に削除しますか？')) {
            cardElement.remove();
            const transaction = db.transaction('cardData', 'readwrite');
            const objectStore = transaction.objectStore('cardData');
            objectStore.delete(cardId);
        }
    }

    function loadAllCards() {
        const transaction = db.transaction('cardData', 'readonly');
        const objectStore = transaction.objectStore('cardData');
        const request = objectStore.getAll();

        request.onsuccess = (event) => {
            const cardDatas = event.target.result;
            if (cardDatas && cardDatas.length > 0) {
                document.getElementById('character-card-list').innerHTML = '';
                cardDatas.forEach(cardData => {
                    loadCard(cardData);
                });
            } else {
                for (let i = 0; i < 3; i++) {
                    createCard();
                }
            }
        };

        request.onerror = (event) => {
            console.error('Failed to load all cards:', event.target.errorCode);
            for (let i = 0; i < 3; i++) {
                createCard();
            }
        };
    }
    
    function setupCardEventListeners(cardElement, cardId) {
        const editableElements = cardElement.querySelectorAll('[contenteditable="true"]');
        editableElements.forEach(elem => {
            elem.addEventListener('input', () => {
                saveCard(cardId);
            });
        });

        const fileInput = cardElement.querySelector('.image-file-input');
        const imgContainer = cardElement.querySelector('.character-image');
        const imgElement = cardElement.querySelector('.card-image');

        imgContainer.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imgElement.src = event.target.result;
                    saveCard(cardId);
                };
                reader.readAsDataURL(file);
            }
        });

        cardElement.querySelector('.delete-button').addEventListener('click', () => {
            deleteCard(cardId, cardElement);
        });
    }

    document.getElementById('add-card-button').addEventListener('click', createCard);

</script>
</body>
</html>
