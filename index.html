<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card Editor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .card-main {
            display: flex;
            padding: 15px;
        }

        .character-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-right: 15px;
            border-right: 1px solid #ddd;
        }

        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .character-image::after {
            content: attr(data-rank-number);
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 25px;
            height: 25px;
            background-color: #d11a1a;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8em;
            font-weight: bold;
            color: #fff;
        }

        .character-info .rank {
            font-size: 2.5em;
            font-weight: bold;
            color: #d11a1a;
            line-height: 1;
        }

        .character-info .rank-text {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .character-info .rank-sub {
            font-size: 0.8em;
            color: #888;
        }

        .character-info .rank-s {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #d11a1a;
            color: #fff;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.5em;
            margin-top: 10px;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-left: 15px;
        }

        .stats-table th, .stats-table td {
            text-align: center;
            font-size: 0.9em;
            padding: 5px 0;
        }

        .stats-table th {
            font-weight: bold;
            color: #555;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
        }

        .stats-table td {
            font-weight: bold;
            font-size: 1.2em;
        }

        .card-footer {
            padding: 15px;
            font-size: 0.9em;
            border-top: 1px solid #ddd;
        }

        .card-footer ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .card-footer li {
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .card-footer li::before {
            content: '・';
            color: #d11a1a;
            font-weight: bold;
            display: inline-block;
            width: 1em;
            margin-left: -1em;
        }

        .card-footer .source {
            text-align: right;
            font-size: 0.8em;
            color: #aaa;
            margin-top: 10px;
            font-family: 'Roboto Mono', monospace;
        }

        /* Edit form styles */
        .editor-form {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .editor-form label {
            margin-top: 10px;
            font-weight: bold;
        }
        .editor-form input, .editor-form textarea {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .editor-form textarea {
            height: 100px;
        }
        .editor-form .button-group {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .editor-form button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .editor-form button.save {
            background-color: #d11a1a;
            color: #fff;
            margin-left: 10px;
        }
        .editor-form button.cancel {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <div class="card-display" id="card-display">
        </div>

    <div class="editor-form" id="editor-form">
        <h2>カードの編集</h2>
        <label for="edit-image-url">キャラクター画像URL:</label>
        <input type="text" id="edit-image-url">

        <label for="edit-rank-number">順位:</label>
        <input type="number" id="edit-rank-number">

        <label for="edit-character-name">キャラクター名:</label>
        <input type="text" id="edit-character-name">

        <label for="edit-total-rank">総合順位:</label>
        <input type="text" id="edit-total-rank" placeholder="例: /22位">

        <label for="edit-tier-rank">ティアランク (例: S):</label>
        <input type="text" id="edit-tier-rank">

        <label for="edit-durability">耐久:</label>
        <input type="text" id="edit-durability">

        <label for="edit-attack">攻撃:</label>
        <input type="text" id="edit-attack">

        <label for="edit-stability">安定性:</label>
        <input type="text" id="edit-stability">

        <label for="edit-mobility">機動力:</label>
        <input type="text" id="edit-mobility">

        <label for="edit-support">援護:</label>
        <input type="text" id="edit-support">

        <label for="edit-footer-text">詳細情報 (改行はカンマ「,」で区切る):</label>
        <textarea id="edit-footer-text"></textarea>

        <label for="edit-source">出典:</label>
        <input type="text" id="edit-source">

        <div class="button-group">
            <button class="cancel" onclick="toggleForm()">キャンセル</button>
            <button class="save" onclick="saveCard()">保存</button>
        </div>
    </div>

    <script>
        const cardDisplay = document.getElementById('card-display');
        const editorForm = document.getElementById('editor-form');

        const cardData = {
            imageUrl: 'https://via.placeholder.com/80?text=ウーブ',
            rankNumber: '2',
            rank: '4',
            characterName: 'ウーブ',
            totalRank: '/22位',
            tierRank: 'S',
            stats: {
                durability: 'B',
                attack: 'SS',
                stability: 'A',
                mobility: 'S',
                support: 'B'
            },
            footerText: [
                'パッシブ「サイクロン」により技を使用するごとにラッシュの手数を増やすことが出来る',
                '技1の範囲が広く追い込み性能が非常に高い',
                '序盤の耐久だけが不安要素なので相手との距離を意識して戦う必要がある',
                '技2は自身に依存するデバフを無効化する効果を持っており安定した機動力を保つことが出来る。'
            ],
            source: 'Perfect Troll'
        };

        function renderCard() {
            const footerItems = cardData.footerText.map(item => `<li>${item}</li>`).join('');
            
            cardDisplay.innerHTML = `
                <div class="card-container">
                    <div class="card-main">
                        <div class="character-info">
                            <div class="character-image" style="background-image: url('${cardData.imageUrl}');" data-rank-number="${cardData.rankNumber}"></div>
                            <div class="rank">${cardData.rank}<span style="font-size: 0.5em;">位</span></div>
                            <div class="rank-text">${cardData.characterName}</div>
                            <div class="rank-sub">${cardData.totalRank}</div>
                            <div class="rank-s">${cardData.tierRank}</div>
                        </div>
                        <table class="stats-table">
                            <thead>
                                <tr>
                                    <th>耐久</th>
                                    <th>攻撃</th>
                                    <th>安定性</th>
                                    <th>機動力</th>
                                    <th>援護</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>${cardData.stats.durability}</td>
                                    <td>${cardData.stats.attack}</td>
                                    <td>${cardData.stats.stability}</td>
                                    <td>${cardData.stats.mobility}</td>
                                    <td>${cardData.stats.support}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer">
                        <ul>${footerItems}</ul>
                        <div class="source">${cardData.source}</div>
                    </div>
                </div>
            `;
            const editButton = document.createElement('button');
            editButton.textContent = 'このカードを編集';
            editButton.style.marginTop = '20px';
            editButton.style.padding = '10px 20px';
            editButton.style.border = 'none';
            editButton.style.borderRadius = '5px';
            editButton.style.backgroundColor = '#d11a1a';
            editButton.style.color = '#fff';
            editButton.style.cursor = 'pointer';
            editButton.onclick = toggleForm;
            cardDisplay.appendChild(editButton);
        }

        function toggleForm() {
            if (editorForm.style.display === 'flex') {
                editorForm.style.display = 'none';
                cardDisplay.style.display = 'block';
            } else {
                editorForm.style.display = 'flex';
                cardDisplay.style.display = 'none';
                // フォームに現在のデータをセット
                document.getElementById('edit-image-url').value = cardData.imageUrl;
                document.getElementById('edit-rank-number').value = cardData.rankNumber;
                document.getElementById('edit-rank-number').value = cardData.rank;
                document.getElementById('edit-character-name').value = cardData.characterName;
                document.getElementById('edit-total-rank').value = cardData.totalRank;
                document.getElementById('edit-tier-rank').value = cardData.tierRank;
                document.getElementById('edit-durability').value = cardData.stats.durability;
                document.getElementById('edit-attack').value = cardData.stats.attack;
                document.getElementById('edit-stability').value = cardData.stats.stability;
                document.getElementById('edit-mobility').value = cardData.stats.mobility;
                document.getElementById('edit-support').value = cardData.stats.support;
                document.getElementById('edit-footer-text').value = cardData.footerText.join(', ');
                document.getElementById('edit-source').value = cardData.source;
            }
        }

        function saveCard() {
            cardData.imageUrl = document.getElementById('edit-image-url').value;
            cardData.rankNumber = document.getElementById('edit-rank-number').value;
            cardData.rank = document.getElementById('edit-rank-number').value;
            cardData.characterName = document.getElementById('edit-character-name').value;
            cardData.totalRank = document.getElementById('edit-total-rank').value;
            cardData.tierRank = document.getElementById('edit-tier-rank').value;
            cardData.stats.durability = document.getElementById('edit-durability').value;
            cardData.stats.attack = document.getElementById('edit-attack').value;
            cardData.stats.stability = document.getElementById('edit-stability').value;
            cardData.stats.mobility = document.getElementById('edit-mobility').value;
            cardData.stats.support = document.getElementById('edit-support').value;
            cardData.footerText = document.getElementById('edit-footer-text').value.split(',').map(item => item.trim());
            cardData.source = document.getElementById('edit-source').value;
            
            renderCard();
            toggleForm();
        }
        
        // 最初のカード表示
        renderCard();
    </script>

</body>
</html>
