<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター評価（空白テンプレート）</title>
    <style>
        body {
            font-family: -apple-system, Blink-Mac-System, "Helvetica Neue", "Segoe UI", YuGothic, "Yu Gothic", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .character-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }
        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            border: 3px solid #f9d71c;
            position: relative;
            background-color: #e0e0e0; /* 画像がない場合の背景色 */
        }
        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .character-image::after {
            content: attr(data-rank);
            position: absolute;
            bottom: -5px;
            right: -5px;
            background-color: #a42c2c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 12px;
            border: 2px solid white;
            line-height: 1;
        }
        .character-name {
            font-size: 28px;
            font-weight: bold;
            color: #4a4a4a;
        }
        .character-rank {
            background-color: #a42c2c;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-left: 10px;
        }
        .ranking-text {
            font-size: 18px;
            color: #777;
            margin-left: 10px;
        }
        .stats-table {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            text-align: center;
        }
        .stats-item {
            flex: 1;
            padding: 8px;
        }
        .stats-item:first-child {
            background-color: #c9c9c9;
            font-weight: bold;
        }
        .stats-item .label {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .stats-item .value {
            font-size: 20px;
            font-weight: bold;
        }
        .skill-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skill-list li {
            position: relative;
            padding-left: 1.5em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .skill-list li::before {
            content: '・';
            position: absolute;
            left: 0;
            color: #4a4a4a;
        }
        .editable {
            border: 1px dashed #ccc;
            padding: 2px;
        }
        .image-input {
            margin-top: 10px;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            cursor: pointer;
            text-align: center;
        }
        .image-input:hover {
            background-color: #e9e9e9;
        }
    </style>
</head>
<body>

    <div class="character-card">
        <div class="card-header">
            <div class="character-image" data-rank="?">
                <img src="" alt="" id="char1-image">
            </div>
            <div>
                <div class="character-name" contenteditable="true" data-id="char1-name">キャラクター名</div>
                <div style="display: flex; align-items: baseline;">
                    <span class="character-rank" contenteditable="true" data-id="char1-rank">?位</span>
                    <span class="ranking-text" contenteditable="true" data-id="char1-rank-total">/??位</span>
                    <span class="character-rank" style="background-color: #3b5998;" contenteditable="true" data-id="char1-tier">?</span>
                </div>
            </div>
        </div>
        <label for="char1-file" class="image-input">画像を選択</label>
        <input type="file" id="char1-file" style="display: none;" accept="image/*" data-image-id="char1-image">
        <div class="stats-table" contenteditable="true" data-id="char1-stats">
            <div class="stats-item">
                <div class="label">耐久</div>
                <div class="value">?</div>

        </div>
        <ul class="skill-list" contenteditable="true" data-id="char1-skills">
            <li>ここにスキルや評価を入力してください</li>

    <script>
        // IndexedDBのセットアップ
        const dbName = 'characterDB';
        const dbVersion = 1;
        let db;

        const request = indexedDB.open(dbName, dbVersion);

        request.onerror = (event) => {
            console.error('IndexedDB error:', event.target.errorCode);
        };

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains('data')) {
                db.createObjectStore('data');
            }
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            loadAllData();
        };

        // ローカルストレージとIndexedDBからデータを読み込む
        function loadAllData() {
            // テキストデータの読み込み（localStorage）
            document.querySelectorAll('[data-id]').forEach(element => {
                const id = element.getAttribute('data-id');
                const savedData = localStorage.getItem(id);
                if (savedData) {
                    element.innerHTML = savedData;
                }
            });

            // 画像データの読み込み（IndexedDB）
            const transaction = db.transaction('data', 'readonly');
            const objectStore = transaction.objectStore('data');
            
            document.querySelectorAll('input[type="file"]').forEach(input => {
                const imageId = input.getAttribute('data-image-id');
                const request = objectStore.get(imageId);
                request.onsuccess = (event) => {
                    const imageData = event.target.result;
                    if (imageData) {
                        const imgElement = document.getElementById(imageId);
                        if (imgElement) {
                            imgElement.src = imageData;
                        }
                    }
                };
            });
        }

        // データを自動保存
        function saveData(id, value) {
            localStorage.setItem(id, value);
        }

        // 入力時のイベントリスナー（テキスト）
        document.querySelectorAll('[contenteditable="true"]').forEach(element => {
            element.addEventListener('input', (e) => {
                saveData(e.target.getAttribute('data-id'), e.target.innerHTML);
            });
        });

        // ファイル入力のイベントリスナー（画像）
        document.querySelectorAll('input[type="file"]').forEach(input => {
            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                const imageId = e.target.getAttribute('data-image-id');
                const imgElement = document.getElementById(imageId);

                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const dataUrl = event.target.result;
                        imgElement.src = dataUrl;

                        // IndexedDBに画像を保存
                        const transaction = db.transaction('data', 'readwrite');
                        const objectStore = transaction.objectStore('data');
                        const putRequest = objectStore.put(dataUrl, imageId);

                        putRequest.onsuccess = () => {
                            console.log('Image saved to IndexedDB');
                        };
                        putRequest.onerror = () => {
                            console.error('Error saving image to IndexedDB');
                        };
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        // ページ読み込み時に実行
        window.addEventListener('load', loadAllData);
    </script>
