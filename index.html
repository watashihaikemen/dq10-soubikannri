<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター評価</title>
    <style>
        body {
            font-family: -apple-system, Blink-Mac-System, "Helvetica Neue", "Segoe UI", YuGothic, "Yu Gothic", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .character-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            border: 3px solid #f9d71c;
            position: relative;
            background-color: #e0e0e0;
            cursor: pointer;
        }
        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .character-image::after {
            display: none; /* ここを変更しました */
            content: attr(data-rank);
            position: absolute;
            bottom: -5px;
            right: -5px;
            background-color: #a42c2c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 12px;
            border: 2px solid white;
            line-height: 1;
        }
        .character-name {
            font-size: 28px;
            font-weight: bold;
            color: #4a4a4a;
        }
        .character-rank {
            background-color: #a42c2c;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-left: 10px;
        }
        .ranking-text {
            font-size: 18px;
            color: #777;
            margin-left: 10px;
        }
        .stats-table {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            text-align: center;
        }
        .stats-item {
            flex: 1;
            padding: 8px;
        }
        .stats-item:first-child {
            background-color: #c9c9c9;
            font-weight: bold;
        }
        .stats-item .label {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .stats-item .value {
            font-size: 20px;
            font-weight: bold;
        }
        .skill-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skill-list li {
            position: relative;
            padding-left: 1.5em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .skill-list li::before {
            content: '・';
            position: absolute;
            left: 0;
            color: #4a4a4a;
        }
        .image-input {
            display: none;
        }
        .add-button {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        .add-button:hover {
            background-color: #45a049;
        }
        /* 削除ボタンを透明にして見えなくする */
        .delete-button {
            position: absolute;
            top: 0;
            right: 0;
            width: 50px; /* タップしやすいように大きさを確保 */
            height: 50px;
            background-color: transparent; /* 背景を透明に */
            color: transparent; /* 文字色を透明に */
            border: none;
            cursor: pointer;
            z-index: 10; /* 他の要素の上に配置 */
        }
        .card-template {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="character-card-list">
        </div>
    <button class="add-button" id="add-card-button">カードを追加</button>
</div>

<div id="card-template" class="character-card card-template">
    <button class="delete-button" title="カードを削除">削除</button>
    <div class="card-header">
        <div class="character-image" data-rank="?">
            <img src="" alt="" class="card-image">
        </div>
        <div>
            <div class="character-name" contenteditable="true">キャラクター名</div>
            <div style="display: flex; align-items: baseline;">
                <span class="character-rank" contenteditable="true">?位</span>
                <span class="ranking-text" contenteditable="true">/??位</span>
                <span class="character-rank" style="background-color: #3b5998;" contenteditable="true">?</span>
            </div>
        </div>
    </div>
    <label class="image-input">画像を選択</label>
    <input type="file" style="display: none;" accept="image/*" class="image-file-input">
    <div class="stats-table">
        <div class="stats-item">
            <div class="label">耐久</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">攻撃</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">安定性</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">機動力</div>
            <div class="value" contenteditable="true">?</div>
        </div>
        <div class="stats-item">
            <div class="label">援護</div>
            <div class="value" contenteditable="true">?</div>
        </div>
    </div>
    <ul class="skill-list">
        <li contenteditable="true">スキルや評価を入力してください</li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
        <li contenteditable="true"></li>
    </ul>
</div>

<script>
    const dbName = 'characterDB';
    const dbVersion = 3; 
    let db;

    const request = indexedDB.open(dbName, dbVersion);

    request.onerror = (event) => {
        console.error('IndexedDB error:', event.target.errorCode);
    };

    request.onupgradeneeded = (event) => {
        db = event.target.result;
        // データストアが存在しない場合のみ作成
        if (!db.objectStoreNames.contains('cardData')) {
            db.createObjectStore('cardData', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('cardOrder')) {
            db.createObjectStore('cardOrder');
        }
    };

    request.onsuccess = (event) => {
        db = event.target.result;
        loadAllCards();
    };

    function saveCardData(cardId, data) {
        const transaction = db.transaction('cardData', 'readwrite');
        const objectStore = transaction.objectStore('cardData');
        
        // IDを指定してデータを保存
        objectStore.put({ id: cardId, data: data });
    }

    function loadCardData(cardId) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction('cardData', 'readonly');
            const objectStore = transaction.objectStore('cardData');
            const request = objectStore.get(cardId);
            
            request.onsuccess = (event) => {
                resolve(event.target.result ? event.target.result.data : null);
            };

            request.onerror = () => reject('Data not found');
        });
    }

    function deleteCardData(cardId) {
        const transaction = db.transaction('cardData', 'readwrite');
        const objectStore = transaction.objectStore('cardData');
        objectStore.delete(cardId);
    }

    function setupCardEventListeners(cardElement, cardId) {
        const editableElements = cardElement.querySelectorAll('[contenteditable="true"]');
        const imgContainer = cardElement.querySelector('.character-image');
        const imgElement = cardElement.querySelector('.card-image');
        const fileInput = cardElement.querySelector('.image-file-input');
        
        const saveData = () => {
            const data = {
                image: imgElement.src,
                name: cardElement.querySelector('.character-name').innerHTML,
                rank: cardElement.querySelector('.character-rank').innerHTML,
                rankingText: cardElement.querySelector('.ranking-text').innerHTML,
                value1: cardElement.querySelector('.character-rank[style*="background-color: rgb(59, 89, 152);"]').innerHTML,
                value2: cardElement.querySelectorAll('.stats-item .value')[0].innerHTML,
                value3: cardElement.querySelectorAll('.stats-item .value')[1].innerHTML,
                value4: cardElement.querySelectorAll('.stats-item .value')[2].innerHTML,
                value5: cardElement.querySelectorAll('.stats-item .value')[3].innerHTML,
                value6: cardElement.querySelectorAll('.stats-item .value')[4].innerHTML,
            };
            cardElement.querySelectorAll('.skill-list li').forEach((li, index) => {
                data[`skill${index}`] = li.innerHTML;
            });
            saveCardData(cardId, data);
        };

        editableElements.forEach((elem) => {
            elem.addEventListener('input', saveData);
        });

        imgContainer.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imgElement.src = event.target.result;
                    saveData();
                };
                reader.readAsDataURL(file);
            }
        });
        
        cardElement.querySelector('.delete-button').addEventListener('click', () => {
            if (confirm('このカードを本当に削除しますか？')) {
                deleteCard(cardId, cardElement);
            }
        });
    }

    async function createCard(cardId = null) {
        const template = document.getElementById('card-template');
        const cardClone = template.cloneNode(true);
        cardClone.classList.remove('card-template');
        
        const newCardId = cardId || `card_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        cardClone.setAttribute('data-card-id', newCardId);
        
        document.getElementById('character-card-list').appendChild(cardClone);
        setupCardEventListeners(cardClone, newCardId);

        if (cardId) {
            const savedData = await loadCardData(cardId);
            if (savedData) {
                cardClone.querySelector('.card-image').src = savedData.image;
                cardClone.querySelector('.character-name').innerHTML = savedData.name;
                cardClone.querySelector('.character-rank').innerHTML = savedData.rank;
                cardClone.querySelector('.ranking-text').innerHTML = savedData.rankingText;
                cardClone.querySelector('.character-rank[style*="background-color: rgb(59, 89, 152);"]').innerHTML = savedData.value1;
                const statsValues = cardClone.querySelectorAll('.stats-item .value');
                statsValues[0].innerHTML = savedData.value2;
                statsValues[1].innerHTML = savedData.value3;
                statsValues[2].innerHTML = savedData.value4;
                statsValues[3].innerHTML = savedData.value5;
                statsValues[4].innerHTML = savedData.value6;
                
                const skillListItems = cardClone.querySelectorAll('.skill-list li');
                skillListItems.forEach((li, index) => {
                    if (savedData[`skill${index}`]) {
                        li.innerHTML = savedData[`skill${index}`];
                    }
                });
            }
        } else {
            const emptyData = {
                image: '',
                name: 'キャラクター名',
                rank: '?位',
                rankingText: '/??位',
                value1: '?',
                value2: '?',
                value3: '?',
                value4: '?',
                value5: '?',
                value6: '?',
                skill0: 'スキルや評価を入力してください',
                skill1: '',
                skill2: '',
                skill3: ''
            };
            saveCardData(newCardId, emptyData);
        }

        saveCardOrder();
    }

    function deleteCard(cardId, cardElement) {
        cardElement.remove();
        deleteCardData(cardId);
        saveCardOrder();
    }

    function saveCardOrder() {
        const cardIds = Array.from(document.querySelectorAll('.character-card:not(.card-template)')).map(card => card.getAttribute('data-card-id'));
        const transaction = db.transaction('cardOrder', 'readwrite');
        const objectStore = transaction.objectStore('cardOrder');
        objectStore.put(cardIds, 'order');
    }

    function loadAllCards() {
        const transaction = db.transaction('cardOrder', 'readonly');
        const objectStore = transaction.objectStore('cardOrder');
        const request = objectStore.get('order');

        request.onsuccess = (event) => {
            const cardIds = event.target.result;
            if (cardIds && cardIds.length > 0) {
                document.getElementById('character-card-list').innerHTML = '';
                cardIds.forEach(cardId => {
                    createCard(cardId);
                });
            } else {
                for (let i = 0; i < 3; i++) {
                    createCard();
                }
            }
        };

        request.onerror = (event) => {
            console.error('Failed to load card order:', event.target.errorCode);
            for (let i = 0; i < 3; i++) {
                createCard();
            }
        };
    }

    document.getElementById('add-card-button').addEventListener('click', () => createCard());
</script>
</body>
</html>
